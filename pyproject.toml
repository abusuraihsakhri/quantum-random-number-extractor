[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-random-number-extractor"
version = "2.0.0"
description = "QRNG-Entropy: NIST SP 800-90B Physical Entropy Source & Min-Entropy Estimator"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=8.0"]

[project.scripts]
quantum-random-number-extractor = "qrng_entropy.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/quantum-random-number-extractor"
Repository = "https://github.com/abusuraihsakhri/quantum-random-number-extractor.git"

[tool.pytest.ini_options]
testpaths = ["tests"]
