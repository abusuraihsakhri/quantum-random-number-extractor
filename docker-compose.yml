version: '3.8'

services:
  quantum-random-number-extractor:
    build: .
    container_name: quantum-random-number-extractor
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
